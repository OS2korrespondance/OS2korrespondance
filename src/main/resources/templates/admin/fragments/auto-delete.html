<div th:fragment="autoDeleteList">
    <div id="autoDeleteConfiguration">
        <p>Når automatisk sletning er slået til, vil beskeder automatisk blive slettet efter det konfigurerede antal dage, hvis de er læst</p>
        <th:block th:each="inbox : ${inboxes}">
            <div th:replace="~{admin/fragments/auto-delete :: autoDelete(${inbox}, ${autoDeleteUrl})}"></div>
        </th:block>
    </div>
</div>

<div th:fragment="autoDelete(inbox, autoDeleteUrl)">
    <div class="ibox">
        <div class="ibox-title">
            <em class="fa fa-trash"></em> &nbsp; Automatisk sletning - <th:block th:text="${inbox.organisationName}"></th:block>
        </div>
        <div class="ibox-content">
            <div class="d-flex mt-3" style="padding-left:15px;">
                <div class="ml-1 mr-2">
                    <input type="checkbox" class="i-checks auto-delete-toggle"
                           th:checked="${inbox.autoDeleteEnabled}"
                           th:data-inbox="${inbox.eanIdentifier}"
                           onchange="toggleAutoDelete(this)">
                </div>
                <label>Aktivér automatisk sletning</label>
            </div>

            <div class="auto-delete-config"
                 th:id="'auto-delete-config-' + ${inbox.eanIdentifier}"
                 th:style="${inbox.autoDeleteEnabled} ? '' : 'display:none;'">
                <div class="px-3 pt-3">
                    <div class="form-group">
                        <label>Antal dage inden sletning</label>
                        <input type="number" class="form-control form-control-sm"
                               th:id="'auto-delete-days-' + ${inbox.eanIdentifier}"
                               th:value="${inbox.autoDeleteDays}"
                               placeholder="dage">
                    </div>
                    <div class="d-flex justify-content-end pb-3">
                        <button type="button" class="btn btn-primary btn-lg"
                                th:data-inbox="${inbox.eanIdentifier}"
                                th:data-url="${autoDeleteUrl}"
                                onclick="saveAutoDelete(this)">
                            Gem
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
