<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header(datatables = true, checkbox = true)}" />
<body class="top-navigation">
    <div id="wrapper">
        <div id="page-wrapper" class="gray-bg">
            <div th:replace="~{fragments/topbar :: topbar(page=settings)}"></div>

            <div class="wrapper wrapper-content">
                <div class="row">
                    <div class="col-lg-1"></div>
                    <div class="col-lg-10">
                        <ul class="nav nav-tabs" id="settingsTabs" role="tablist">
                            <li class="nav-item">
                                <a class="nav-link active" id="tab-email" data-toggle="tab" href="#pane-email"
                                   role="tab" data-fragment-url="/admin/settings/emailconfig"
                                   data-target-id="emailConfiguration" data-loader="loadDataTable">
                                    <em class="fa fa-users"></em> &nbsp; E-mail notifikationer
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" id="tab-monitoring" data-toggle="tab" href="#pane-monitoring"
                                   role="tab" data-fragment-url="/admin/settings/monitoringconfig"
                                   data-target-id="monitoringConfiguration" data-loader="loadMonitoringConfig">
                                    <em class="fa fa-heartbeat"></em> &nbsp; Overvågning
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" id="tab-autoreply" data-toggle="tab" href="#pane-autoreply"
                                   role="tab" data-fragment-url="/admin/settings/autoreplyconfig"
                                   data-target-id="autoReplyConfiguration" data-loader="loadAutoReplyConfig">
                                    <em class="fa fa-reply"></em> &nbsp; Automatisk svar
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" id="tab-autodelete" data-toggle="tab" href="#pane-autodelete"
                                   role="tab" data-fragment-url="/admin/settings/autodeleteconfig"
                                   data-target-id="autoDeleteConfiguration" data-loader="loadAutoDeleteConfig">
                                    <em class="fa fa-trash"></em> &nbsp; Automatisk sletning
                                </a>
                            </li>
                        </ul>

                        <div class="tab-content" id="settingsTabContent">
                            <div class="tab-pane fade show active" id="pane-email" role="tabpanel">
                                <div class="ibox mb-0">
                                    <div class="ibox-content" id="emailConfiguration">
                                    </div>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="pane-monitoring" role="tabpanel">
                                <div class="ibox mb-0">
                                    <div class="ibox-content" id="monitoringConfiguration">
                                    </div>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="pane-autoreply" role="tabpanel">
                                <div class="ibox mb-0">
                                    <div class="ibox-content" id="autoReplyConfiguration">
                                    </div>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="pane-autodelete" role="tabpanel">
                                <div class="ibox mb-0">
                                    <div class="ibox-content" id="autoDeleteConfiguration">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <style>
        .table > thead > tr:first-child > th,
        .table > tbody > tr:first-child > th,
        .table > tfoot > tr:first-child > th,
        .table > thead > tr:first-child > td,
        .table > tbody > tr:first-child > td,
        .table > tfoot > tr:first-child > td {
          border-top: none;
        }

        .table > tbody > tr > th:last-child,
        .table > tbody > tr > td:last-child,
        .table > tfoot > tr > th:last-child,
        .table > tfoot > tr > td:last-child {
          padding-right: 0px;
        }

        .table > tbody > tr > th:first-child,
        .table > tbody > tr > td:first-child,
        .table > tfoot > tr > th:first-child,
        .table > tfoot > tr > td:first-child {
          padding-left: 0px;
        }
        
        #recipientsTable .ibox-content {
            padding: 0;
        }
        
/*         Workaround for medcom-mailbox.css */
        @media only screen and (max-width: 990px) {
            table {
                table-layout: auto !important;
            }
            
            .ibox-content {
                padding: 0;
            }
        }

/*         Checkbox vertical alignment in the column */
        .icheckbox_square-green {
/*             vertical-align: -webkit-baseline-middle; */
        }

        #settingsTabs {
            border-bottom: 2px solid #e7eaec;
        }

        #settingsTabs .nav-link {
            color: #676a6c;
            border: none;
            padding: 10px 20px;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        #settingsTabs .nav-link:hover {
            border-bottom-color: #1ab394;
            color: #1ab394;
        }

        #settingsTabs .nav-link.active {
            border-bottom-color: #1ab394;
            color: #1ab394;
            background: transparent;
        }

        .tab-content > .tab-pane > .ibox {
            border-top: none;
        }

        .tab-content > .tab-pane > .ibox > .ibox-content {
            min-height: 200px;
        }

    </style>
    
    <div th:replace="~{fragments/footer :: scripts(datatables = true, checkbox = true)}" />

    <script th:inline="javascript">
        /*<![CDATA[*/
        var token = $("meta[name='_csrf']").attr("content");
        $.fn.dataTable.ext.errMode = 'throw';

        $(document).ready(function () {
            initSettingsTabs();
        });
        /*]]>*/
    </script>
    <script th:src="@{/js/settings/settings-tabs.js}"></script>
    <script th:src="@{/js/settings/email-config.js}"></script>
    <script th:src="@{/js/settings/auto-reply.js}"></script>
    <script th:src="@{/js/settings/auto-delete.js}"></script>
    <script th:src="@{/js/settings/monitoring.js}"></script>
</body>
</html>
